server {
    listen 80;
    root /usr/share/nginx/html;

    #forward api calls to the backend container, dropping the /api prefix
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
    }

    #serve the react app, falling back to index.html for client side urls
    location / {
        try_files $uri /index.html;
    }
}
